<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seite nicht gefunden – ConjuExpert</title>
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#f5e4c3" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --display:"Space Grotesk",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --ink:#14151a;--muted:#5b6373;--surface:#fff;--surface-2:#f6f7fb;
  --border:rgba(20,22,30,.09);
  --shadow:0 30px 80px -34px rgba(30,35,60,.45);
  --shadow-sm:0 12px 34px -18px rgba(30,35,60,.32);
  --violet:#a557ff;
  --vivid:linear-gradient(100deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#00bcd4,#0a84ff,#a557ff);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:var(--display);color:var(--ink);background:#fbfbfd;-webkit-font-smoothing:antialiased;line-height:1.55;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:32px 22px;text-align:center;overflow-x:hidden}
.wrap{position:relative;max-width:560px;width:100%}
.wrap::before{content:"";position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:760px;height:420px;background:var(--vivid);filter:blur(130px);opacity:.13;z-index:-1;border-radius:50%;pointer-events:none}
.brand{display:inline-flex;align-items:center;gap:11px;margin-bottom:30px;text-decoration:none}
.brand-mark{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:32px;height:32px;padding:5px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow-sm);flex:none}
.brand-mark i{display:block;border-radius:3px}
.brand-name{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.02em;color:#e71583}
.brand-name b{font-weight:700;background:linear-gradient(90deg,#0a84ff,#a557ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.code{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,48px);line-height:1.06;letter-spacing:-.035em;margin:12px auto 14px;max-width:16ch;text-wrap:balance}
.grad-word{background:var(--vivid);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{font-size:clamp(15px,1.6vw,18px);color:var(--muted);max-width:42ch;margin:0 auto 34px;text-wrap:pretty}
.links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--display);font-weight:700;font-size:16px;padding:15px 26px;border-radius:16px;border:0;cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .18s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-primary{position:relative;color:#fff;overflow:hidden;box-shadow:0 18px 40px -16px rgba(120,40,200,.55)}
.btn-primary .g{position:absolute;inset:0;background:var(--vivid);background-size:240% 100%;animation:slide 5s linear infinite}
.btn-primary .l{position:relative;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 24px 48px -16px rgba(120,40,200,.6)}
@keyframes slide{to{background-position:240% 0}}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);box-shadow:var(--shadow-sm)}
.btn-ghost:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--violet) 42%,transparent);color:var(--violet)}
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="https://conjuexpert.app/landing/" aria-label="ConjuExpert"><span class="brand-mark" data-mark></span><span class="brand-name">Conju<b>Expert</b></span></a>
  <div class="code">Fehler 404</div>
  <h1>Diese Seite konnten wir <span class="grad-word">nicht finden</span>.</h1>
  <p class="lead">Vielleicht ein Tippfehler oder ein alter Link. Hier geht's weiter:</p>
  <div class="links">
    <a class="btn btn-primary" href="https://conjuexpert.app"><span class="g"></span><span class="l">App öffnen</span></a>
    <a class="btn btn-ghost" href="https://conjuexpert.app/blog/">Blog</a>
    <a class="btn btn-ghost" href="https://conjuexpert.app/bewertungen/">Bewertungen</a>
  </div>
</main>
<script>
var BR=["#ff3b5c","#ff7a18","#ffc400","#34c759","#0a84ff"];
document.querySelectorAll('[data-mark]').forEach(function(m){for(var i=0;i<5;i++){var s=document.createElement('i');s.style.background=BR[i];m.appendChild(s);}});
</script>
</body>
</html>
