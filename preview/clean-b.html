<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entwurf B · Warm Sand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe9df; --page:#e3dccd; --card:#fffdf9; --card2:#f4eee2;
    --ink:#221f18; --muted:#766f60; --line:rgba(60,48,24,.13);
    --acc:#3a3528; /* gedämpfter Graphit/Taupe-Akzent, keine bunte Farbe */
    --disp:"Space Grotesk",system-ui,sans-serif;
    --shadow:0 20px 46px -28px rgba(70,55,25,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  svg{display:block}
  body{font-family:var(--disp);background:var(--page);color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:14px 12px 76px}
  .lab{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8b8270;margin:4px 0 12px}
  .phone{width:100%;max-width:390px;background:var(--bg);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:11px;padding:15px 16px 11px;background:var(--card);border-bottom:1px solid var(--line)}
  .ic{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .ic svg{width:17px;height:17px}
  .brand{flex:1;text-align:center;font-weight:700;font-size:19px;letter-spacing:-.02em}
  .streak{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .streak svg{width:14px;height:14px}
  .langs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:11px 12px 8px;background:var(--card)}
  .lang{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;color:var(--muted)}
  .lang span{font-weight:700;font-size:15px}
  .lang small{font-size:9px}
  .lang.on{background:var(--card2);border-color:var(--line);color:var(--ink)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 12px 10px;background:var(--card);border-bottom:1px solid var(--line)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:11px;color:var(--muted);font-weight:600;font-size:11.5px;cursor:pointer}
  .tab svg{width:18px;height:18px;opacity:.7}
  .tab.on{background:var(--card2);color:var(--ink)}
  .tab.on svg{opacity:1}
  .body{padding:16px 16px 24px}
  .inputrow{display:flex;gap:10px;margin-bottom:12px}
  .input{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;font-size:17px;font-weight:600;box-shadow:0 3px 12px -10px rgba(70,55,25,.25)}
  .input b{font-size:11px;font-weight:700;color:var(--muted);background:var(--card2);border-radius:6px;padding:3px 7px}
  .dice{width:54px;flex:none;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .dice svg{width:22px;height:22px}
  .cta{width:100%;border:0;border-radius:15px;padding:16px;font-family:var(--disp);font-weight:700;font-size:15.5px;color:#fff;background:var(--acc);cursor:pointer;box-shadow:0 12px 26px -16px rgba(40,32,15,.5)}
  .hero{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
  .kick{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .h1{font-size:26px;line-height:1.08;letter-spacing:-.02em;font-weight:700}
  .plan{margin:16px 0 10px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .pcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:9px;font-weight:600;font-size:13.5px;background:var(--card2)}
  .pcard .pi{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .pcard .pi svg{width:16px;height:16px}
  .pcard .arr{margin-left:auto;color:var(--muted)}
  .sw{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
  .sw a{padding:0 16px;height:38px;display:flex;align-items:center;border-radius:999px;text-decoration:none;font-weight:700;color:var(--muted);font-size:13px}
  .sw a.on{background:var(--acc);color:#fff}
</style>
</head>
<body>
  <div class="lab">Entwurf B · Warm Sand</div>
  <div class="phone">
    <div class="bar">
      <button class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="brand">ConjuExpert</div>
      <div class="streak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>0</div>
    </div>
    <div class="langs">
      <div class="lang on"><span>DE</span><small>Deutsch</small></div>
      <div class="lang"><span>ES</span><small>Español</small></div>
      <div class="lang"><span>EN</span><small>English</small></div>
      <div class="lang"><span>NL</span><small>Nederl.</small></div>
      <div class="lang"><span>FR</span><small>Français</small></div>
    </div>
    <div class="tabs">
      <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M9 9v12"/></svg>Konjugieren</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a3 3 0 0 1 5.6 1c0 2-2.9 2.5-2.9 4.1"/><path d="M12 17.6h.01"/></svg>Quiz</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6 11v4.4c0 1.1 2.7 2.4 6 2.4s6-1.3 6-2.4V11"/></svg>Lernen</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20.5 12 16l-6 4.5V5.6A1.6 1.6 0 0 1 7.6 4h8.8A1.6 1.6 0 0 1 18 5.6z"/></svg>Gemerkt</div>
    </div>
    <div class="body">
      <div class="inputrow">
        <div class="input"><b>DE</b> gehen</div>
        <button class="dice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <button class="cta">Konjugieren</button>
      <div class="hero">
        <div class="kick">Dein Plan heute</div>
        <h2 class="h1">Sprich Deutsch souverän.</h2>
        <p class="plan">Dein Plan für heute, Janine:</p>
        <div class="pcard"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M9 9v12"/></svg></span>12 Konjugationen üben<span class="arr">›</span></div>
        <div class="pcard"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a3 3 0 0 1 5.6 1c0 2-2.9 2.5-2.9 4.1"/><path d="M12 17.6h.01"/></svg></span>Ein kurzes Quiz<span class="arr">›</span></div>
      </div>
    </div>
  </div>
  <div class="sw"><a href="clean-a.html">A</a><a href="clean-b.html" class="on">B</a><a href="clean-c.html">C</a></div>
</body>
</html>
