<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>ConjuExpert — Quiz (Designvorlage)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ font-family:"Schibsted Grotesk", system-ui, sans-serif; background:#ded5c4;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }

.screen{ --bg:#f4eede; --surf:#fffdf6; --surf2:#ece3d0; --text:#211d15; --muted:#8b8068;
  --bd:rgba(50,38,12,.14); --line:rgba(50,38,12,.10); --selbg:#211d15; --selfg:#fdf8ec; --gold:#b8902f;
  --rb:linear-gradient(90deg,#ff5a4d,#ff9e2c,#ffcf3f,#5bbf6a,#3aa6c9,#5b8def,#a874e6);
  --raise:0 2px 0 rgba(50,38,12,.06), 0 7px 16px -11px rgba(60,45,15,.5);
  width:404px; height:780px; background:var(--bg); color:var(--text); border-radius:34px; overflow:hidden; position:relative;
  box-shadow:0 34px 80px -34px rgba(60,45,15,.5), inset 0 0 0 1px rgba(255,255,255,.5); }
.sb{ display:flex; align-items:center; justify-content:space-between; padding:11px 24px 5px; font-size:12px; font-weight:700; }
.sb .dots{ display:flex; gap:4px; opacity:.7; } .sb .dots b{ width:5px; height:5px; border-radius:50%; background:var(--text); } .sb .dots i{ width:17px; height:10px; border:1.5px solid var(--text); border-radius:3px; }
.hdr{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; padding:8px 16px 12px; }
.greet{ justify-self:start; display:inline-flex; align-items:center; gap:5px; font-size:13.5px; font-weight:600; }
.wm{ justify-self:center; font-size:19px; font-weight:600; letter-spacing:-0.02em; white-space:nowrap; } .wm b{ font-weight:700; background:var(--rb); -webkit-background-clip:text; background-clip:text; color:transparent; }
.streak{ justify-self:end; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--bd); background:var(--surf); border-radius:999px; padding:6px 10px 6px 8px; box-shadow:0 4px 10px -7px rgba(60,45,15,.5); }
.streak .bars{ display:flex; align-items:flex-end; gap:1.5px; height:12px; } .streak .bars i{ width:2.4px; border-radius:2px; background:var(--muted); opacity:.5; }
.streak .bars i:nth-child(1){height:5px}.streak .bars i:nth-child(2){height:8px}.streak .bars i:nth-child(3){height:11px}.streak .bars i:nth-child(4){height:7px}.streak .bars i:nth-child(5){height:4px}
.streak .fl{ width:12px; height:12px; color:var(--gold); } .streak b{ font-size:12.5px; font-weight:700; }
.langseg{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:0 14px 12px; }
.langseg button{ height:40px; border:1px solid var(--bd); border-radius:12px; background:linear-gradient(180deg,#fffefa,var(--surf2)); font-family:inherit; font-weight:700; font-size:12.5px; color:var(--muted); box-shadow:var(--raise); }
.langseg button .ln{ display:block; font-size:8px; font-weight:500; opacity:.8; } .langseg button.on{ background:var(--selbg); color:var(--selfg); border-color:var(--selbg); }
.modehd{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:0 16px; margin-bottom:8px; }
.modescroll{ display:flex; gap:8px; padding:0 14px 4px; overflow:hidden; }
.mpill{ flex:none; width:72px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 4px 9px; border:1px solid var(--bd); border-radius:15px; background:linear-gradient(180deg,#fffefa,var(--surf2)); box-shadow:var(--raise); }
.mpill svg{ width:20px; height:20px; color:var(--muted); } .mpill span{ font-size:11px; font-weight:600; color:var(--muted); }
.mpill.on{ position:relative; background:var(--surf2); box-shadow:inset 0 2px 6px rgba(50,38,12,.16); border-color:transparent; }
.mpill.on svg{ color:var(--gold); } .mpill.on span{ color:var(--text); font-weight:700; }
.mpill.on::after{ content:""; position:absolute; left:14px; right:14px; bottom:5px; height:2.5px; border-radius:3px; background:var(--rb); }
.form{ background:var(--surf); margin:12px 14px 0; border:1px solid var(--bd); border-radius:18px; padding:2px 14px 8px; box-shadow:var(--raise); }
.row{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 2px; }
.row:not(:last-child)::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; border-radius:2px; background:var(--rb); opacity:.5; }
.rlab{ font-size:14px; font-weight:700; }
.val{ display:inline-flex; align-items:center; gap:9px; height:40px; flex:none; max-width:230px; padding:0 12px; border-radius:12px; background:linear-gradient(180deg,#fffefa,var(--surf2)); border:1px solid var(--bd); box-shadow:var(--raise); font-size:14px; font-weight:600; color:var(--text); cursor:pointer; }
.val span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; flex:none; }
.val .car{ width:11px; height:11px; color:var(--muted); }
.rich b{ font-weight:800; } .rich .arr{ width:13px; height:13px; color:var(--muted); } .rich .rmode{ font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; } .rich .swap{ width:13px; height:13px; color:var(--gold); }
.explain{ margin:12px 14px 14px; border:1px solid var(--bd); border-radius:16px; background:var(--surf); box-shadow:var(--raise); overflow:hidden; }
.exhead{ display:flex; align-items:center; gap:9px; width:100%; padding:13px 14px; border:0; background:transparent; cursor:pointer; font-family:inherit; font-weight:700; font-size:14px; color:var(--text); }
.exhead .hb{ width:16px; height:16px; color:var(--gold); flex:none; }
.exhead .excar{ margin-left:auto; width:13px; height:13px; color:var(--muted); transition:transform .2s; flex:none; }
.explain.open .excar{ transform:rotate(180deg); }
.exbody{ padding:0 14px 14px; font-size:13px; line-height:1.5; color:var(--muted); }
.exbody b{ color:var(--text); }
.explain:not(.open) .exbody{ display:none; }
.tabbar{ position:absolute; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:9px 12px 23px; background:var(--surf); border-top:1px solid var(--line); box-shadow:0 -10px 30px -18px rgba(60,45,15,.4); }
.tabbar::after{ content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:9px; width:120px; height:4px; border-radius:4px; background:var(--bd); }
.tabbar button{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; border:0; background:transparent; font-family:inherit; font-weight:600; font-size:10px; color:var(--muted); padding:7px 0 9px; border-radius:14px; }
.tabbar button svg{ width:20px; height:20px; } .tabbar button.on{ color:var(--text); background:var(--surf2); box-shadow:inset 0 2px 5px rgba(50,38,12,.14); } .tabbar button.on svg{ color:var(--gold); }
.tabbar button.on::before{ content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:18px; height:3px; border-radius:3px; background:var(--rb); }
.tprof .ring{ width:30px; height:30px; border-radius:50%; background:var(--rb); padding:2.5px; display:flex; box-shadow:0 4px 10px -5px rgba(60,45,15,.5); }
.tprof .ring i{ flex:1; border-radius:50%; background:var(--selbg); color:var(--selfg); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; font-style:normal; }
.tprof .pl{ color:var(--text); font-weight:700; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const I = {
  car:`<svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>`,
  fl:`<svg class="fl" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 3.2-1.4 4.4-1.4 6.6a2.4 2.4 0 004.8.2c.7 1 1.1 2.2 1.1 3.4a4.5 4.5 0 11-9 0c0-2.7 1.6-4.2 2.8-5.6C11.6 5.4 12.3 4 12 2z"/></svg>`,
  arr:`<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`,
  swap:`<svg class="swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>`,
  bulb:`<svg class="hb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10c.7.7 1 1.3 1 2h6c0-.7.3-1.3 1-2a6 6 0 00-4-10z"/></svg>`,
  conj:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M15 4v16"/></svg>`,
  quiz:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 015.2 1c0 1.8-2.6 2.1-2.6 3.8"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>`,
  learn:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l9-4 9 4-9 4-9-4z"/><path d="M7 11v4.2c0 1.1 2.2 2.3 5 2.3s5-1.2 5-2.3V11"/></svg>`,
  save:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4h12v16l-6-4-6 4z"/></svg>`,
  cards:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="8" y="3" width="12" height="15" rx="2.5"/><path d="M5 7v12a2 2 0 002 2h9"/></svg>`,
  choice:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="6" cy="7" r="1.7"/><path d="M10 7h9"/><circle cx="6" cy="13" r="1.7"/><path d="M10 13h9"/></svg>`,
  type:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>`,
  speed:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>`,
  mic:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0012 0M12 17v4"/></svg>`,
};
const NAV=[["conj","Konjugieren"],["quiz","Quiz"],["learn","Lernen"],["save","Gemerkt"]];
const MODES=[["cards","Karten"],["choice","Auswahl"],["type","Tippen"],["speed","Speed"],["mic","Sprechen"]];
const LANGS=[["DE","Deutsch"],["ES","Español"],["EN","English"],["NL","Nederlands"],["FR","Français"]];
function topblock(){ return `<div class="sb"><span>9:41</span><span class="dots"><b></b><b></b><b></b><i></i></span></div>
  <header class="hdr"><span class="greet">Hi, Jani 👋</span><div class="wm">Conju<b>Expert</b></div>
    <button class="streak"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span>${I.fl}<b>0</b></button></header>
  <div class="langseg">${LANGS.map(([c,n],i)=>`<button class="${i===3?'on':''}">${c}<span class="ln">${n}</span></button>`).join('')}</div>
  <div class="modehd">Quiz-Modus</div><div class="modescroll">${MODES.map(([ic,l],i)=>`<button class="mpill ${i===0?'on':''}">${I[ic]}<span>${l}</span></button>`).join('')}</div>
  <div class="explain open">
    <button class="exhead" onclick="this.closest('.explain').classList.toggle('open')">${I.bulb}<span>Erklärung</span><svg class="excar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="exbody">Bei <b>Karten</b> siehst du eine Aufgabe, tippst die Karte an und drehst sie um, um die richtige Antwort zu sehen — ganz entspannt, in deinem Tempo.</div>
  </div>
  <div class="form">
    <div class="row"><span class="rlab">Zeitform</span><button class="val"><span>Alle Zeitformen</span>${I.car}</button></div>
    <div class="row"><span class="rlab">Wörter</span><button class="val"><span>Alle</span>${I.car}</button></div>
    <div class="row"><span class="rlab">Richtung</span><button class="val rich"><b>NL</b>${I.arr}<b>DE</b><span class="rmode">Erkennen</span>${I.swap}</button></div>
    <div class="row"><span class="rlab">Themen</span><button class="val"><span>1 / 17</span>${I.car}</button></div>
  </div>`; }
function tabbar(){
  const base=NAV.map(([ic,l],i)=>`<button class="${i===1?'on':''}">${I[ic]}<span>${l}</span></button>`).join('');
  return `<div class="tabbar">${base}<button class="tprof"><span class="ring"><i>J</i></span><span class="pl">Profil</span></button></div>`;
}
document.getElementById('root').innerHTML = `<div class="screen">${topblock()}${tabbar()}</div>`;
</script>
</body>
</html>
