<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CI-Variante 2 · Regenbogen-Unterstrich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe7d8; --page:#e3dccd; --card:#fffdf8; --card2:#f3ecde;
    --ink:#1b1813; --muted:#6a6253; --line:rgba(60,48,24,.13);
    --espresso:#2c2823;
    --rb:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);
    --disp:"Space Grotesk",system-ui,sans-serif;
    --shadow:0 22px 48px -28px rgba(70,55,25,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  svg{display:block}
  body{font-family:var(--disp);background:var(--page);color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:14px 12px 76px}
  .lab{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#8b8270;margin:4px 0 12px;text-align:center}
  .phone{width:100%;max-width:390px;background:var(--bg);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:11px;padding:15px 16px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .ic{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  .ic svg{width:17px;height:17px}
  .brand{flex:1;text-align:center;font-weight:700;font-size:19px;letter-spacing:-.02em}
  .brand b{background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent}
  .streak{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card2)}
  .streak svg{width:14px;height:14px}
  .langs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 12px 8px;background:var(--card)}
  .lang{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;cursor:pointer;color:var(--muted)}
  .lang span{font-weight:700;font-size:15px}
  .lang small{font-size:9px}
  .lang.on{color:var(--ink)}
  .lang.on::after{content:"";position:absolute;left:24%;right:24%;bottom:2px;height:3px;border-radius:3px;background:var(--rb)}
  .tabs{display:flex;gap:20px;padding:8px 18px 0;background:var(--card);justify-content:center;border-bottom:1px solid var(--line)}
  .tab{display:flex;align-items:center;gap:7px;padding:8px 2px 12px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
  .tab svg{width:17px;height:17px;opacity:.7}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .tab.on svg{opacity:1}
  .body{padding:18px 16px 24px}
  .inputrow{display:flex;gap:10px;margin-bottom:12px}
  .input{flex:1;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fffefb,#fbf6ec);border:1px solid var(--line);border-radius:15px;padding:15px;font-size:17px;font-weight:600;box-shadow:0 8px 18px -12px rgba(70,55,25,.35),inset 0 1px 0 rgba(255,255,255,.8)}
  .input b{font-size:11px;font-weight:700;color:var(--muted);background:var(--card2);border-radius:6px;padding:3px 7px}
  .dice{width:54px;flex:none;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -7px rgba(70,55,25,.4)}
  .dice svg{width:22px;height:22px}
  .cta{width:100%;border:0;border-radius:15px;padding:16px;font-family:var(--disp);font-weight:700;font-size:15.5px;color:#fff;background:linear-gradient(180deg,#3a352c,#211e19);cursor:pointer;box-shadow:0 16px 30px -14px rgba(30,22,8,.6),0 2px 6px -3px rgba(30,22,8,.45),inset 0 1px 0 rgba(255,255,255,.12)}
  .cta:active{transform:translateY(1px)}
  .hero{margin-top:26px}
  .kick{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .h1{font-size:30px;line-height:1.06;letter-spacing:-.025em;font-weight:700}
  .h1 u{text-decoration:none;position:relative;white-space:nowrap}
  .h1 u::after{content:"";position:absolute;left:1px;right:1px;bottom:-2px;height:4px;border-radius:4px;background:var(--rb)}
  .plan{margin:22px 0 8px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .pcard{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;font-weight:600;font-size:14px;background:linear-gradient(180deg,#fffdf9,#f4eee2);box-shadow:0 6px 14px -12px rgba(70,55,25,.4),inset 0 1px 0 rgba(255,255,255,.7)}
  .pcard .pi{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .pcard .pi svg{width:17px;height:17px}
  .pcard .arr{margin-left:auto;color:var(--muted)}
  .sw{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
  .sw a{padding:0 15px;height:38px;display:flex;align-items:center;border-radius:999px;text-decoration:none;font-weight:700;color:var(--muted);font-size:13px}
  .sw a.on{background:var(--espresso);color:#fff}
</style>
</head>
<body>
  <div class="lab">CI-Variante 2 · Regenbogen-Unterstrich</div>
  <div class="phone">
    <div class="bar">
      <button class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="brand">Conju<b>Expert</b></div>
      <div class="streak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>0</div>
    </div>
    <div class="langs">
      <div class="lang on"><span>DE</span><small>Deutsch</small></div>
      <div class="lang"><span>ES</span><small>Español</small></div>
      <div class="lang"><span>EN</span><small>English</small></div>
      <div class="lang"><span>NL</span><small>Nederl.</small></div>
      <div class="lang"><span>FR</span><small>Français</small></div>
    </div>
    <div class="tabs">
      <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M9 9v12"/></svg>Konjugieren</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a3 3 0 0 1 5.6 1c0 2-2.9 2.5-2.9 4.1"/><path d="M12 17.6h.01"/></svg>Quiz</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6 11v4.4c0 1.1 2.7 2.4 6 2.4s6-1.3 6-2.4V11"/></svg>Lernen</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20.5 12 16l-6 4.5V5.6A1.6 1.6 0 0 1 7.6 4h8.8A1.6 1.6 0 0 1 18 5.6z"/></svg>Gemerkt</div>
    </div>
    <div class="body">
      <div class="inputrow">
        <div class="input"><b>DE</b> gehen</div>
        <button class="dice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <button class="cta">Konjugieren</button>
      <div class="hero">
        <div class="kick">Dein Plan heute</div>
        <h2 class="h1">Sprich Deutsch <u>souverän.</u></h2>
        <p class="plan">Dein Plan für heute, Janine:</p>
        <div class="pcard"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M9 9v12"/></svg></span>12 Konjugationen üben<span class="arr">›</span></div>
        <div class="pcard"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a3 3 0 0 1 5.6 1c0 2-2.9 2.5-2.9 4.1"/><path d="M12 17.6h.01"/></svg></span>Ein kurzes Quiz<span class="arr">›</span></div>
      </div>
    </div>
  </div>
  <div class="sw"><a href="ci-1.html">1</a><a href="ci-2.html" class="on">2</a><a href="ci-3.html">3</a></div>
</body>
</html>
