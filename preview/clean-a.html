<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entwurf A · Editorial Mono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f3f1; --page:#e7e7e3; --card:#ffffff; --line:rgba(20,20,18,.10);
    --ink:#16160f; --muted:#6f6f68; --acc:#16160f;
    --sans:"Inter",system-ui,sans-serif; --serif:"Fraunces",Georgia,serif;
    --rb:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);
    --shadow:0 18px 44px -28px rgba(20,20,15,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  svg{display:block}
  body{font-family:var(--sans);background:var(--page);color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:14px 12px 76px}
  .lab{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#86867d;margin:4px 0 12px}
  .phone{width:100%;max-width:390px;background:var(--bg);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
  /* header */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .ic{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--card)}
  .ic svg{width:17px;height:17px}
  .brand{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em}
  .brand b{font-weight:600;background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent}
  .streak{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted)}
  .streak svg{width:15px;height:15px}
  /* language as quiet dropdown */
  .langrow{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px;background:var(--card)}
  .langlbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .langsel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-weight:600;font-size:14px}
  .langsel svg{width:13px;height:13px;color:var(--muted)}
  /* tabs underline */
  .tabs{display:flex;gap:22px;padding:10px 18px 0;background:var(--card);justify-content:flex-start}
  .tab{padding:8px 0 13px;color:var(--muted);font-weight:500;font-size:14px;border-bottom:2px solid transparent;cursor:pointer}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
  .body{padding:22px 18px 26px}
  .inputrow{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:12px}
  .input{flex:1;display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-size:26px;font-weight:600}
  .input b{font-family:var(--sans);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;align-self:center}
  .dice{width:34px;height:34px;border:0;background:none;color:var(--muted);cursor:pointer}
  .dice svg{width:22px;height:22px}
  .cta{width:100%;margin-top:20px;border:0;border-radius:13px;padding:16px;font-family:var(--sans);font-weight:600;font-size:15.5px;color:#fff;background:linear-gradient(180deg,#2a2a22,#121210);cursor:pointer;box-shadow:0 16px 30px -14px rgba(20,20,15,.55),0 2px 5px -3px rgba(20,20,15,.5),inset 0 1px 0 rgba(255,255,255,.12)}
  .cta:active{transform:translateY(1px)}
  .hero{margin-top:30px}
  .kick{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .h1{font-family:var(--serif);font-size:34px;line-height:1.06;letter-spacing:-.01em;font-weight:600}
  .h1 em{font-style:italic;position:relative;white-space:nowrap}
  .h1 em::after{content:"";position:absolute;left:1px;right:1px;bottom:-.04em;height:3px;border-radius:3px;background:var(--rb)}
  .plan{margin:22px 0 0;font-size:13.5px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:13px;border-top:1px solid var(--line);padding:15px 2px;font-size:14.5px;font-weight:500}
  .row .n{width:24px;color:var(--muted);font-size:13px}
  .row .arr{margin-left:auto;color:var(--muted)}
  .row .arr svg{width:16px;height:16px}
  .sw{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
  .sw a{padding:0 16px;height:38px;display:flex;align-items:center;border-radius:999px;text-decoration:none;font-weight:600;color:var(--muted);font-size:13px}
  .sw a.on{background:var(--ink);color:#fff}
</style>
</head>
<body>
  <div class="lab">Entwurf A · Editorial Mono</div>
  <div class="phone">
    <div class="bar">
      <button class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="brand">Conju<b>Expert</b></div>
      <div class="streak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>0</div>
    </div>
    <div class="langrow">
      <span class="langlbl">Sprache</span>
      <button class="langsel">Deutsch <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="tabs">
      <div class="tab on">Konjugieren</div>
      <div class="tab">Quiz</div>
      <div class="tab">Lernen</div>
      <div class="tab">Gemerkt</div>
    </div>
    <div class="body">
      <div class="inputrow">
        <div class="input"><b>DE</b> gehen</div>
        <button class="dice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <button class="cta">Konjugieren</button>
      <div class="hero">
        <div class="kick">Dein Plan heute</div>
        <h2 class="h1">Sprich Deutsch <em>souverän.</em></h2>
        <p class="plan">Janine, weiter geht's:</p>
        <div class="row"><span class="n">01</span>12 Konjugationen üben<span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        <div class="row"><span class="n">02</span>Ein kurzes Quiz<span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
      </div>
    </div>
  </div>
  <div class="sw"><a href="clean-a.html" class="on">A</a><a href="clean-b.html">B</a><a href="clean-c.html">C</a></div>
</body>
</html>
