<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vorschau C · Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe7d8; --page:#e3d8c4; --card:#fffdf8; --card2:#f3ecde;
    --ink:#1b1813; --muted:#7c7264; --line:rgba(60,48,24,.12);
    --espresso:#2c2823; --shadow:0 22px 48px -26px rgba(70,55,25,.38);
    --rainbow:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);
    --disp:"Space Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  svg{display:block}
  body{font-family:var(--disp);background:var(--page);color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:14px 12px 70px}
  .label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a7c63;margin:4px 0 12px}
  .label b{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cnav{width:100%;max-width:390px;display:flex;gap:4px;margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px}
  .cnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:12px;padding:9px 4px;border-radius:999px}
  .cnav a.cur{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .phone{position:relative;width:100%;max-width:390px;background:var(--bg);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
  .bar{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
  .menu{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center}
  .menu svg{width:15px;height:15px}
  .brand{flex:1;text-align:center;font-weight:600;font-size:19px;letter-spacing:-.02em}
  .brand b{font-weight:700;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
  .streak{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .streak svg{width:13px;height:13px}
  .avatar{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid #fff;outline:1.5px solid color-mix(in srgb,var(--ink) 24%,transparent);background:var(--card2);color:var(--ink);font-weight:700;font-size:13px}
  .behind{position:relative;padding:16px 16px 26px;filter:saturate(.9)}
  .behind::after{content:"";position:absolute;inset:0;background:rgba(20,16,8,.34);backdrop-filter:blur(1.5px);z-index:2}
  .ghost{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;font-weight:600;color:var(--muted);margin-bottom:11px}
  .ghostcta{background:var(--espresso);color:#fff;text-align:center;border-radius:14px;padding:15px;font-weight:700;margin-bottom:16px;opacity:.92}
  .ghostcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;height:150px}
  .dd{position:absolute;z-index:4;top:54px;right:12px;width:250px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 26px 50px -18px rgba(40,30,10,.5);overflow:hidden}
  .dd::before{content:"";position:absolute;top:-7px;right:18px;width:13px;height:13px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
  .ddhead{display:flex;align-items:center;gap:11px;padding:15px;border-bottom:1px solid var(--line)}
  .ddhead .av{width:42px;height:42px;flex:none;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:17px}
  .ddhead b{font-size:14.5px;display:block}
  .ddhead small{font-size:11px;color:var(--muted);display:block;margin-top:1px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ddhead .lvl{margin-top:6px;display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--rainbow);border-radius:999px;padding:3px 8px}
  .ddlist{padding:6px}
  .item{display:flex;align-items:center;gap:12px;padding:11px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
  .item:hover{background:var(--card2)}
  .item .ic{width:20px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink);opacity:.85}
  .item .ic svg{width:19px;height:19px}
  .item .arr{margin-left:auto;color:var(--muted)}
  .item.prem .tx{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
  .sep{height:1px;background:var(--line);margin:6px 4px}
  .item.out{color:var(--ink)}
  .item.out .ic{opacity:.85}
  .switch{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
  .switch a{width:40px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;font-weight:700;color:var(--muted);font-size:14px}
  .switch a.cur{background:var(--espresso);color:#fff}
</style>
</head>
<body>
  <div class="label">Variante <b>C</b> · Profil-Dropdown</div>
  <div class="cnav">
    <a href="c.html">Konjugieren</a>
    <a href="c-ziele.html">Ziele</a>
    <a href="c-konto.html">Konto</a>
    <a href="c-profil.html" class="cur">Profil</a>
  </div>
  <div class="phone">
    <div class="bar">
      <button class="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="brand">Conju<b>Expert</b></div>
      <div class="streak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>0</div>
      <button class="avatar">J</button>
    </div>
    <div class="behind">
      <div class="ghost">DE · gehen</div>
      <div class="ghostcta">Konjugieren</div>
      <div class="ghostcard"></div>
    </div>

    <div class="dd">
      <div class="ddhead">
        <div class="av">J</div>
        <div>
          <b>Janine</b>
          <small>janine.teetz88@gmail.com</small>
          <span class="lvl">Deutsch · A2</span>
        </div>
      </div>
      <div class="ddlist">
        <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span>Ziele<span class="arr">›</span></div>
        <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="M8.5 20v-5M13 20V9.5M17.5 20v-8"/></svg></span>Statistik<span class="arr">›</span></div>
        <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9a5.5 5.5 0 0 1 11 0c0 5 2.2 6.5 2.2 6.5H4.3S6.5 14 6.5 9z"/><path d="M10.2 19a2 2 0 0 0 3.6 0"/></svg></span>Erinnerungen<span class="arr">›</span></div>
        <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.3M12 19.2v2.3M21.5 12h-2.3M4.8 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/></svg></span>Einstellungen<span class="arr">›</span></div>
        <div class="item prem"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.7 5.3a2 2 0 0 0 1.3 1.3L20.3 11l-5.3 1.7a2 2 0 0 0-1.3 1.3L12 19.3l-1.7-5.3a2 2 0 0 0-1.3-1.3L3.7 11l5.3-1.7a2 2 0 0 0 1.3-1.3z"/></svg></span><span class="tx">Premium freischalten</span></div>
        <div class="sep"></div>
        <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg></span>Sprache wechseln<span class="arr">›</span></div>
        <div class="item out"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 16l4-4-4-4M20 12H9"/></svg></span>Abmelden</div>
      </div>
    </div>
  </div>
  <div class="switch"><a href="a.html">A</a><a href="b.html">B</a><a href="c.html" class="cur">C</a></div>
</body>
</html>
