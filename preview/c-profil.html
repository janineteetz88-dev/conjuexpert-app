<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vorschau C · Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe7d8; --page:#e3d8c4; --card:#fffdf8; --card2:#f3ecde;
    --ink:#1b1813; --muted:#7c7264; --line:rgba(60,48,24,.13);
    --espresso:#2c2823; --shadow:0 22px 48px -26px rgba(70,55,25,.4);
    --rainbow:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);
    --disp:"Space Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--disp);background:var(--page);color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:14px 12px 70px}
  .label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a7c63;margin:4px 0 12px}
  .label b{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cnav{width:100%;max-width:390px;display:flex;gap:4px;margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px}
  .cnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:12px;padding:9px 4px;border-radius:999px}
  .cnav a.cur{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .phone{position:relative;width:100%;max-width:390px;background:var(--bg);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
  .bar{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
  .menu{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--card2);font-size:14px;color:var(--muted)}
  .brand{flex:1;text-align:center;font-weight:600;font-size:19px;letter-spacing:-.02em}
  .brand b{font-weight:700;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
  .streak{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .avatar{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid #fff;outline:2px solid color-mix(in srgb,var(--ink) 30%,transparent);background:linear-gradient(135deg,#3a352c,#5b5346);color:#fff;font-weight:700;font-size:14px}
  /* dimmed app behind */
  .behind{position:relative;padding:16px 16px 26px;filter:saturate(.9)}
  .behind::after{content:"";position:absolute;inset:0;background:rgba(20,16,8,.34);backdrop-filter:blur(1.5px);z-index:2}
  .ghost{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;font-weight:600;color:var(--muted);margin-bottom:11px}
  .ghostcta{background:var(--espresso);color:#fff;text-align:center;border-radius:14px;padding:15px;font-weight:700;margin-bottom:16px;opacity:.92}
  .ghostcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;height:150px}
  /* dropdown */
  .dd{position:absolute;z-index:4;top:54px;right:12px;width:248px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 26px 50px -18px rgba(40,30,10,.5);overflow:hidden}
  .dd::before{content:"";position:absolute;top:-7px;right:18px;width:13px;height:13px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
  .ddhead{display:flex;align-items:center;gap:11px;padding:15px;border-bottom:1px solid var(--line)}
  .ddhead .av{width:42px;height:42px;flex:none;border-radius:50%;background:linear-gradient(135deg,#3a352c,#5b5346);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
  .ddhead b{font-size:14.5px;display:block}
  .ddhead small{font-size:11px;color:var(--muted);display:block;margin-top:1px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ddhead .lvl{margin-top:6px;display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--rainbow);border-radius:999px;padding:3px 8px}
  .ddlist{padding:6px}
  .item{display:flex;align-items:center;gap:12px;padding:11px 11px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
  .item:hover{background:var(--card2)}
  .item .ic{width:22px;text-align:center;font-size:15px;opacity:.8}
  .item .arr{margin-left:auto;color:var(--muted);font-size:12px}
  .item.prem{color:transparent}
  .item.prem .tx{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
  .sep{height:1px;background:var(--line);margin:6px 4px}
  .item.out{color:#b4453f}
  .switch{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
  .switch a{width:40px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;font-weight:700;color:var(--muted);font-size:14px}
  .switch a.cur{background:var(--espresso);color:#fff}
</style>
</head>
<body>
  <div class="label">Variante <b>C</b> · Profil-Dropdown</div>
  <div class="cnav">
    <a href="c.html">Konjugieren</a>
    <a href="c-ziele.html">Ziele</a>
    <a href="c-konto.html">Konto</a>
    <a href="c-profil.html" class="cur">Profil</a>
  </div>
  <div class="phone">
    <div class="bar">
      <button class="menu">☰</button>
      <div class="brand">Conju<b>Expert</b></div>
      <div class="streak">🔥 0</div>
      <button class="avatar">J</button>
    </div>
    <div class="behind">
      <div class="ghost">DE · gehen</div>
      <div class="ghostcta">Konjugieren</div>
      <div class="ghostcard"></div>
    </div>

    <div class="dd">
      <div class="ddhead">
        <div class="av">J</div>
        <div>
          <b>Janine</b>
          <small>janine.teetz88@gmail.com</small>
          <span class="lvl">Deutsch · A2</span>
        </div>
      </div>
      <div class="ddlist">
        <div class="item"><span class="ic">🎯</span>Ziele<span class="arr">›</span></div>
        <div class="item"><span class="ic">📊</span>Statistik<span class="arr">›</span></div>
        <div class="item"><span class="ic">🔔</span>Erinnerungen<span class="arr">›</span></div>
        <div class="item"><span class="ic">⚙︎</span>Einstellungen<span class="arr">›</span></div>
        <div class="item prem"><span class="ic">⭐</span><span class="tx">Premium freischalten</span></div>
        <div class="sep"></div>
        <div class="item"><span class="ic">🌐</span>Sprache wechseln<span class="arr">›</span></div>
        <div class="item out"><span class="ic">⎋</span>Abmelden</div>
      </div>
    </div>
  </div>
  <div class="switch"><a href="a.html">A</a><a href="b.html">B</a><a href="c.html" class="cur">C</a></div>
</body>
</html>
