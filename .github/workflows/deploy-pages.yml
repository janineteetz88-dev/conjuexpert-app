name: Deploy Pages (Allowlist)

# Baut das öffentliche Publish-Verzeichnis aus einer festen ALLOWLIST statt den
# kompletten Repo-Root 1:1 auszuliefern. Grund: klassisches GitHub Pages
# ("Deploy from a branch") liefert aktuell ALLES aus main aus — inkl.
# supabase/functions (Edge-Function-Quellcode), docs/, scripts/, package.json
# und (wegen .nojekyll) sogar .github/ und .claude/. Siehe Notion-Karte
# „[KRITISCH] Kompletter Repo-Quellcode … öffentlich über die Live-Domain
# abrufbar".
#
# Seit 16.08.2026 scharf: Pages-Source steht auf „GitHub Actions", der erste
# manuelle Testlauf war grün und hat die Live-Site auf den Allowlist-Build
# umgestellt (sensible Pfade wie /supabase/, /docs/, /scripts/, /package.json
# → 404). Der push-Trigger sorgt dafür, dass jeder Merge auf main automatisch
# neu deployt — ohne ihn friert die Live-Site ein, da der alte Branch-Deploy
# mit der Source-Umstellung deaktiviert ist.
#
# Die Allowlist ist absichtlich eine Positivliste (nicht Ausschlussliste):
# neue Top-Level-Dateien/Ordner sind automatisch NICHT öffentlich, bis sie
# hier bewusst ergänzt werden.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinnt die Pages-Source bei jedem Lauf auf „GitHub Actions" (build_type:
      # workflow). Hintergrund: In der Nacht 17.→18.08.2026 wurde die Source
      # wieder auf „Deploy from a branch" zurückgestellt, wodurch der klassische
      # Branch-Deploy den kompletten Repo-Root erneut veröffentlichte (Exposure
      # wieder offen, vom Wächter-Audit ab 18.08. gemeldet). Mit diesem Schritt
      # heilt sich das Deployment selbst: Jeder Lauf stellt die Source zurück,
      # egal wie sie verstellt wurde.
      - name: Pages-Source auf „GitHub Actions" pinnen (selbstheilend)
        uses: actions/configure-pages@v5

      - name: Publish-Verzeichnis aus Allowlist bauen
        run: |
          set -euo pipefail
          OUT="_site"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Einzeldateien, die öffentlich erreichbar sein müssen.
          FILES=(
            index.html app.js manifest.webmanifest sw.js 404.html
            robots.txt sitemap.xml llms.txt CNAME .nojekyll
            google21132ae6fe839054.html favicon.svg apple-touch-icon.png
            icon-192.png icon-512.png icon-maskable.png
            agb.html datenschutz.html impressum.html barrierefreiheit.html
            bildnachweise.html back-to-app.js
            logo-wordmark.png
          )
          # logo-wordmark.png wird nicht von der Site selbst verlinkt, aber
          # per absoluter URL in den Transaktions-Mails eingebettet
          # (emails/*/email-1-welcome.html) — muss deshalb trotzdem live sein.

          # Ganze Verzeichnisse, die öffentlich erreichbar sein müssen.
          DIRS=(engine fonts vendor blog konjugation landing bewertungen start)

          missing=0
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" "$OUT/"
            else
              echo "::warning::Allowlist-Datei fehlt im Repo, übersprungen: $f"
            fi
          done
          for d in "${DIRS[@]}"; do
            if [ -d "$d" ]; then
              cp -r "$d" "$OUT/"
            else
              echo "::error::Allowlist-Verzeichnis fehlt im Repo: $d"
              missing=1
            fi
          done
          # Diese 3 Dateien sind für App-Start bzw. SEO essenziell — ohne sie
          # lieber hart abbrechen als eine kaputte Seite deployen.
          for critical in index.html app.js sw.js; do
            [ -f "$OUT/$critical" ] || { echo "::error::Kritische Datei fehlt: $critical"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

          {
            echo "## Deploy-Allowlist — Publish-Verzeichnis"
            echo ""
            echo "- Dateien gesamt: $(find "$OUT" -type f | wc -l)"
            echo "- Größe: $(du -sh "$OUT" | cut -f1)"
            echo ""
            echo "### NICHT enthalten (bewusst ausgeschlossen)"
            echo ""
            comm -23 <(ls -A | sort) <(printf '%s\n' "${FILES[@]}" "${DIRS[@]}" | sort) | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # PageSpeed Insights (18.08.2026) zeigte auf Mobil FCP 3,8s / LCP 4,7s (rot)
      # bei TBT 10ms / CLS 0 (grün) — reine Downloadgröße vor dem ersten Render war
      # der Engpass, nicht Interaktivität. Minifiziert NUR die Kopie in _site, die
      # Quelldateien im Repo (app.js, index.html) bleiben unverändert und direkt
      # editierbar — siehe scripts/minify-for-deploy.mjs.
      - name: Node.js einrichten (für Minifizierung)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS/CSS im Publish-Verzeichnis minifizieren
        run: |
          set -euo pipefail
          npm ci
          {
            echo "### Minifizierung (nur im Publish-Verzeichnis, Quelldateien unverändert)"
            echo '```'
            node scripts/minify-for-deploy.mjs _site
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
