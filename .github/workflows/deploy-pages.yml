name: Deploy Pages (Allowlist)

# Baut das öffentliche Publish-Verzeichnis aus einer festen ALLOWLIST statt den
# kompletten Repo-Root 1:1 auszuliefern. Grund: klassisches GitHub Pages
# ("Deploy from a branch") liefert aktuell ALLES aus main aus — inkl.
# supabase/functions (Edge-Function-Quellcode), docs/, scripts/, package.json
# und (wegen .nojekyll) sogar .github/ und .claude/. Siehe Notion-Karte
# „[KRITISCH] Kompletter Repo-Quellcode … öffentlich über die Live-Domain
# abrufbar".
#
# Seit 16.08.2026 scharf: Pages-Source steht auf „GitHub Actions", der erste
# manuelle Testlauf war grün und hat die Live-Site auf den Allowlist-Build
# umgestellt (sensible Pfade wie /supabase/, /docs/, /scripts/, /package.json
# → 404). Der push-Trigger sorgt dafür, dass jeder Merge auf main automatisch
# neu deployt — ohne ihn friert die Live-Site ein, da der alte Branch-Deploy
# mit der Source-Umstellung deaktiviert ist.
#
# Die Allowlist ist absichtlich eine Positivliste (nicht Ausschlussliste):
# neue Top-Level-Dateien/Ordner sind automatisch NICHT öffentlich, bis sie
# hier bewusst ergänzt werden.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prüft die Pages-Source bei jedem Lauf und stellt sie, wenn möglich, auf
      # „GitHub Actions" (build_type: workflow) zurück. Hintergrund: Um den
      # 18.08.2026 wurde die Source auf „Deploy from a branch" zurückgestellt,
      # wodurch der klassische Branch-Deploy den kompletten Repo-Root erneut
      # veröffentlichte (KRITISCH-Exposure). Der zunächst verwendete
      # actions/configure-pages-Schritt (#247) reicht NICHT: Er setzt build_type
      # nur beim Neuanlegen einer Pages-Site und lässt eine bestehende Site
      # unangetastet. Deshalb hier ein expliziter API-Call.
      # Der eingebaute GITHUB_TOKEN darf build_type NICHT ändern (verifiziert
      # 25.08.: PUT /pages → HTTP-Fehler). Echte Selbstheilung braucht deshalb
      # ein Repo-Secret PAGES_ADMIN_TOKEN: fine-grained PAT des Repo-Inhabers,
      # nur für dieses Repo, Permission „Pages: write". Ohne das Secret kann der
      # Schritt nur laut warnen. Bewusst KEIN Abbruch bei Fehlschlag: Der
      # Allowlist-Deploy soll trotzdem laufen (er überschreibt den Voll-Repo-
      # Deploy im Rennen um das Live-Ergebnis — besser als gar kein Deploy).
      - name: Pages-Source auf „GitHub Actions" prüfen/pinnen (selbstheilend)
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          current=$(curl -sf "${hdr[@]}" "$api" | jq -r '.build_type')
          echo "Aktuelle Pages-Source (build_type): $current"
          if [ "$current" = "workflow" ]; then
            echo "Pages-Source steht korrekt auf 'workflow' ✅"
            exit 0
          fi
          echo "::warning::Pages-Source steht auf '$current' — versuche, auf 'workflow' zurückzustellen."
          curl -sf -X PUT "${hdr[@]}" "$api" -d '{"build_type":"workflow"}' || true
          verified=$(curl -sf "${hdr[@]}" "$api" | jq -r '.build_type')
          if [ "$verified" = "workflow" ]; then
            echo "Zurückgestellt und verifiziert: build_type=workflow ✅"
          else
            echo "::error::Pages-Source steht auf '$verified' und konnte mit dem verfügbaren Token NICHT umgestellt werden. Sofort-Fix (1 Klick): Repo-Settings → Pages → Source → 'GitHub Actions'. Dauerhaft: fine-grained PAT (nur dieses Repo, Permission 'Pages: write') als Secret PAGES_ADMIN_TOKEN hinterlegen. Bis dahin racet der klassische Voll-Repo-Deploy bei jedem Push gegen den Allowlist-Build — dank Jekyll-Excludes (_config.yml) ohne Quellcode-Exposure, aber mit unminifiziertem Ergebnis."
          fi

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Baut das öffentliche Publish-Verzeichnis `_site` aus der ALLOWLIST in
      # scripts/build-site.mjs — der EINZIGEN Quelle der Wahrheit, die auch der
      # externe Cloudflare-Pages-Build (`npm ci && npm run build:site`) nutzt.
      # Das Skript kopiert nur die freigegebenen Dateien/Ordner (sensible Pfade
      # wie /supabase/, /docs/, /scripts/, /package.json bleiben so aus dem
      # Live-Verzeichnis) und minifiziert JS/CSS NUR in der _site-Kopie; die
      # Quelldateien im Repo bleiben unverändert und direkt editierbar.
      # PageSpeed (18.08.2026): reine Downloadgröße vor dem ersten Render war der
      # Engpass — deshalb die Minifizierung.
      - name: Publish-Verzeichnis bauen (Allowlist + Minifizierung)
        run: |
          set -euo pipefail
          npm ci
          npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
