name: Generate verb pages

on:
  workflow_dispatch:
    inputs:
      pages_per_run:
        description: 'Pages to generate (0 = alle)'
        default: '0'
      only_verbs:
        description: 'Nur diese Verben, z. B. es:levantarse,es:llamarse (überschreibt Queue)'
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate verb pages
        env:
          PAGES_PER_RUN: ${{ github.event.inputs.pages_per_run || '0' }}
          ONLY_VERBS: ${{ github.event.inputs.only_verbs || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/generate-verb-pages.mjs

      - name: Rebuild language index pages (keep verb counts in sync)
        run: node scripts/build-konjugation-index.mjs

      - name: Commit new pages
        run: |
          git config user.name "conjuexpert-bot"
          git config user.email "bot@conjuexpert.app"
          git add konjugation/ sitemap.xml scripts/verb-queue.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "chore: generate verb pages [skip ci]"
          # Robust gegen parallele Pushes auf denselben Branch: rebasen + retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push-Retry $i…"; sleep 4
          done
          echo "Push nach mehreren Versuchen fehlgeschlagen"; exit 1
