name: Blotato Admin (list/delete schedules)

# Manuelles Werkzeug, um geplante Blotato-Posts aufzulisten oder gezielt zu
# stornieren (z. B. vor dem Veröffentlichungszeitpunkt korrigieren).
# Nur per Hand auslösbar. Ändert das Ledger NICHT.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list (nur anzeigen) oder delete'
        required: true
        default: 'list'
      id:
        description: 'Schedule-/Post-ID (nur bei delete)'
        required: false
        default: ''
      pathseg:
        description: 'API-Segment fuer delete (Default posts)'
        required: false
        default: 'posts'

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Blotato admin
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          ID: ${{ github.event.inputs.id }}
          PATHSEG: ${{ github.event.inputs.pathseg }}
        run: node scripts/social/blotato-admin.mjs
