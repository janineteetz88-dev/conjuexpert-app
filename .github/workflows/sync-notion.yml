name: Sync Notion Tracker

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (keine File-Writes, kein Writeback)"
        type: boolean
        default: true
      refresh_all:
        description: "Alle Live-Artikel neu rendern (nach Template-Änderung; nur bei dry_run=false wirksam)"
        type: boolean
        default: false
      writeback:
        description: "(ohne Wirkung — Writeback läuft jetzt automatisch bei jedem Lauf)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Auto-Writeback: jeder reguläre Lauf (Schedule/Push) setzt Status → "Veröffentlicht"
      # + "Veröffentlicht am" (Datum). Sicherheit bleibt im Skript: nur bei erfolgreichem
      # Deploy, idempotent, ausschließlich Status=="Freigegeben". Ein Dry-Run-Dispatch
      # schreibt trotz WRITEBACK=1 NICHTS (DRY_RUN überschreibt im Skript).
      - name: Freigegeben → rendern + live + Notion aktualisieren
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          WRITEBACK: '1'
          REFRESH_ALL: ${{ inputs.refresh_all && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-from-notion.mjs --dry-run
          else
            node scripts/publish-from-notion.mjs
          fi

      - name: Änderungen committen und pushen
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add src/data/clusters.js blog sitemap.xml
          git diff --staged --quiet || git commit -m "auto: Blog-Pipeline — gerenderte Artikel, clusters.js & sitemap.xml"
          git diff HEAD~1..HEAD --name-only 2>/dev/null | grep -E 'clusters\.js|^blog/|sitemap\.xml' && git push || true

      # Bei Dry-Run read-only (ohne --create) -> legt keine Tracker-Zeilen/Spalten an.
      - name: Notion-Tracker abgleichen
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-notion-tracker.mjs
          else
            node scripts/sync-notion-tracker.mjs --create
          fi
