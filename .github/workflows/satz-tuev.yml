name: Satz-TÜV

# Wöchentliche Qualitäts-Stichprobe der KI-Beispielsätze: erzeugt ~100 Sätze
# über die Worker-Pipeline (Sprachen × Zeitformen × Verben) und lässt jeden
# von einem strengen Richter bewerten. Ergebnis im Job-Summary.
# Rot erst unter 85 % Pass-Rate (echter Alarm, kein Rauschen).

on:
  schedule:
    - cron: "30 5 * * 1"   # montags 05:30 UTC
  workflow_dispatch:

jobs:
  tuev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stichprobe erzeugen & richten
        run: node scripts/satz-tuev.mjs
