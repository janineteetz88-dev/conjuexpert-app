name: Purge Cloudflare cache

# Leert den Cloudflare-Edge-Cache, sobald GitHub Pages eine neue Version
# veröffentlicht hat. Ohne diesen Schritt liefert Cloudflare die alte
# index.html / app.js / sw.js weiter aus — auch im Inkognito-Modus.
#
# Benötigt zwei Repository-Secrets:
#   CLOUDFLARE_ZONE_ID    – Zone-ID der Domain conjuexpert.app
#   CLOUDFLARE_API_TOKEN  – API-Token mit der Berechtigung "Zone · Cache Purge · Purge"

on:
  # Robust: nach jedem Push auf main purgen (kurz warten, bis Pages deployt hat).
  # Der workflow_run-Trigger allein war zwischenzeitlich still ausgefallen — dadurch
  # lieferte Cloudflare wochenlang die alte index.html / app.js aus.
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    # Purgen bei push/manuell — bei workflow_run nur, wenn der Deploy erfolgreich war.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Auf Pages-Deploy warten (nur bei push)
        if: github.event_name == 'push'
        run: |
          echo "Warte ~120s, bis GitHub Pages diesen Commit ausgeliefert hat, bevor Cloudflare geleert wird…"
          sleep 120
      - name: Purge everything
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID oder CLOUDFLARE_API_TOKEN fehlt — bitte als Repo-Secrets hinterlegen. Übersprungen."
            exit 0
          fi
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || { echo "::error::Cloudflare-Purge fehlgeschlagen"; exit 1; }
          echo "Cloudflare-Cache geleert ✅"
