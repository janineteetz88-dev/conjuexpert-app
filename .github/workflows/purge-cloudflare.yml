name: Purge Cloudflare cache

# Leert den Cloudflare-Edge-Cache, sobald GitHub Pages eine neue Version
# veröffentlicht hat. Ohne diesen Schritt liefert Cloudflare die alte
# index.html / app.js / sw.js weiter aus — auch im Inkognito-Modus.
#
# Benötigt zwei Repository-Secrets:
#   CLOUDFLARE_ZONE_ID    – Zone-ID der Domain conjuexpert.app
#   CLOUDFLARE_API_TOKEN  – API-Token mit der Berechtigung "Zone · Cache Purge · Purge"

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    # Nur purgen, wenn der Pages-Deploy erfolgreich war (oder manuell gestartet)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Purge everything
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID oder CLOUDFLARE_API_TOKEN fehlt — bitte als Repo-Secrets hinterlegen. Übersprungen."
            exit 0
          fi
          # --- Diagnose (verrät keine Geheimnisse, nur Längen/Format) ---
          echo "zone_id length = ${#CF_ZONE}  (sollte 32 sein)"
          echo "token  length = ${#CF_TOKEN} (sollte ~40 sein)"
          case "$CF_ZONE" in *[!0-9a-f]*) echo "WARN: zone_id enthält Nicht-Hex-Zeichen (evtl. der Token im falschen Feld?)";; esac
          echo "== Token-Verify =="
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN"
          echo
          echo "== Purge =="
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || { echo "::error::Cloudflare-Purge fehlgeschlagen"; exit 1; }
          echo "Cloudflare-Cache geleert ✅"
