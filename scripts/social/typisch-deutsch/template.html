<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:'SG';src:url('assets/space.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'SB';src:url('assets/schib.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'JB';src:url('assets/mono.woff2') format('woff2');font-weight:400 700;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1c1608;--gold:#ffc400;--gold2:#c79400;--rainbow:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);--dur:11s}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fdf6df;font-family:'SB',sans-serif}
.bg{position:absolute;inset:-10%;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.6}
.b1{width:820px;height:820px;background:#ffc400;left:-6%;top:2%}
.b2{width:760px;height:760px;background:#ff9e2c;right:-8%;top:10%}
.b3{width:900px;height:900px;background:#ffd97a;left:6%;bottom:-8%}
.b4{width:720px;height:720px;background:#ff7a18;right:-6%;bottom:4%}
.b5{width:640px;height:640px;background:#ffe08a;left:34%;top:38%}
body.go .b1{animation:d1 9s ease-in-out infinite alternate}
body.go .b2{animation:d2 var(--dur) ease-in-out infinite alternate}
body.go .b3{animation:d3 10s ease-in-out infinite alternate}
body.go .b4{animation:d4 12s ease-in-out infinite alternate}
body.go .b5{animation:d5 8s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(160px,120px) scale(1.15)}}
@keyframes d2{to{transform:translate(-150px,170px) scale(1.1)}}
@keyframes d3{to{transform:translate(140px,-150px) scale(1.18)}}
@keyframes d4{to{transform:translate(-120px,-130px) scale(1.12)}}
@keyframes d5{to{transform:translate(-190px,110px) scale(1.25)}}
.veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,253,243,.8),rgba(255,251,230,.72));backdrop-filter:blur(6px)}
.logo{position:absolute;top:52px;left:56px;display:flex;align-items:center;gap:14px;z-index:12}
.logo .mark{width:50px;height:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
.logo .w{font-family:'SG';font-weight:600;font-size:34px;letter-spacing:-.02em;color:var(--ink)}
.logo .w b{font-weight:700;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 110px;opacity:0;z-index:3}
.rframe{position:absolute;inset:0;z-index:20;pointer-events:none;padding:20px;
  background:linear-gradient(120deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#00bcd4,#0a84ff,#a557ff,#ff3b5c,#ff7a18);background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:flow 5s linear infinite, glowpulse 2.2s ease-in-out infinite alternate}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes glowpulse{from{filter:drop-shadow(0 0 10px rgba(255,196,0,.6)) drop-shadow(0 0 22px rgba(255,122,24,.4))}to{filter:drop-shadow(0 0 22px rgba(255,158,44,.75)) drop-shadow(0 0 46px rgba(255,196,0,.55))}}
.prog{position:absolute;left:30px;bottom:30px;height:8px;border-radius:999px;background:var(--rainbow);width:0;z-index:12}
body.go .prog{animation:prog var(--dur) linear forwards}
@keyframes prog{from{width:0}to{width:1020px}}
.kw{display:inline-block;opacity:0}
body.go .kw{animation:kin .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes kin{from{opacity:0;transform:translateY(44px) scale(.9);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.eyebrow{font-family:'JB';font-weight:700;font-size:26px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2);margin-bottom:30px}

/* A — not say */
.lead{font-family:'SB';font-weight:400;font-size:52px;color:#6d5f38;line-height:1.2}
.notsay{font-family:'SG';font-weight:700;font-size:92px;letter-spacing:-.02em;color:var(--ink);margin-top:18px;position:relative;display:inline-block}
.notsay .strike{position:absolute;left:-6px;right:-6px;top:52%;height:10px;background:#e0453b;border-radius:6px;transform:scaleX(0);transform-origin:left}
body.go .sA{animation:sA var(--dur) ease both}
@keyframes sA{0%{opacity:1}21%{opacity:1}24%{opacity:0;transform:translateY(-30px)}100%{opacity:0}}
body.go .sA .eyebrow{animation-delay:.05s}
body.go .sA .kw:nth-child(1){animation-delay:.2s}
body.go .sA .kw:nth-child(2){animation-delay:.32s}
body.go .sA .kw:nth-child(3){animation-delay:.44s}
body.go .sA .kw:nth-child(4){animation-delay:.56s}
body.go .sA .notsay{animation:pop2 .5s ease .8s both}
@keyframes pop2{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
body.go .sA .strike{animation:strike .4s ease 1.5s both}
@keyframes strike{to{transform:scaleX(1)}}

/* B — we say */
.wesay-lead{font-family:'SB';font-weight:400;font-size:46px;color:#6d5f38;margin-bottom:26px}
.wesay{font-family:'SG';font-weight:700;font-size:104px;line-height:1.06;letter-spacing:-.02em;color:var(--ink)}
.wesay .hl{background:var(--gold);padding:2px 18px;border-radius:16px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
body.go .sB{animation:sB var(--dur) ease both}
@keyframes sB{0%{opacity:0}25%{opacity:0}29%{opacity:1;transform:none}52%{opacity:1}55%{opacity:0;transform:translateY(-24px)}100%{opacity:0}}
body.go .sB .wesay{animation:rise .6s cubic-bezier(.2,.8,.2,1) 1s both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}

/* C — meaning */
.mean{font-family:'SG';font-weight:700;font-size:70px;line-height:1.12;letter-spacing:-.02em;color:var(--ink)}
.mean .g{color:var(--gold2)}
.tail{font-family:'SB';font-weight:400;font-size:40px;color:#6d5f38;margin-top:34px;max-width:820px}
body.go .sC{animation:sC var(--dur) ease both}
@keyframes sC{0%{opacity:0}55%{opacity:0}59%{opacity:1;transform:none}77%{opacity:1}80%{opacity:0;transform:translateY(-22px)}100%{opacity:0}}

/* D — CTA */
.dbig{font-family:'SG';font-weight:700;font-size:74px;line-height:1.05;letter-spacing:-.02em;color:var(--ink);margin-bottom:40px}
.pill{font-family:'SG';font-weight:700;font-size:46px;color:#fff;background:var(--ink);border-radius:999px;padding:26px 54px;box-shadow:0 20px 44px -16px rgba(28,22,8,.5)}
.beta{margin-top:40px;font-family:'JB';font-weight:700;font-size:32px;color:var(--ink)}
.beta .code{background:var(--ink);color:var(--gold);padding:6px 16px;border-radius:10px}
.beta2{font-family:'JB';font-weight:700;font-size:24px;letter-spacing:.06em;color:#8a7c50;margin-top:16px;text-transform:uppercase}
body.go .sD{animation:sD var(--dur) ease both}
@keyframes sD{0%{opacity:0}80%{opacity:0}83%{opacity:1;transform:none}100%{opacity:1}}
body.go .sD .pill{animation:pop var(--dur) ease both}
@keyframes pop{0%{transform:scale(.9)}83%{transform:scale(.9)}88%{transform:scale(1.04)}93%{transform:scale(1)}100%{transform:scale(1)}}
</style></head>
<body>
<div id="reel">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="blob b5"></div></div>
  <div class="veil"></div>
  <div class="logo">
    <svg class="mark" viewBox="1 4 30 24" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="16" width="3" height="11" rx="1.5" fill="#ff3b5c"/><rect x="6.5" y="12" width="3" height="15" rx="1.5" fill="#ff7a18"/><rect x="10.5" y="8" width="3" height="19" rx="1.5" fill="#ffc400"/><rect x="14.5" y="5" width="3" height="22" rx="1.5" fill="#34c759"/><rect x="18.5" y="8" width="3" height="19" rx="1.5" fill="#00bcd4"/><rect x="22.5" y="12" width="3" height="15" rx="1.5" fill="#0a84ff"/><rect x="26.5" y="16" width="3" height="11" rx="1.5" fill="#a557ff"/></svg>
    <span class="w">Conju<b>Expert</b></span>
  </div>

  <div class="scene sA">
    <div class="eyebrow" id="a-eye"></div>
    <div class="lead" id="a-lead"></div>
    <div class="notsay" id="a-notsay"></div>
  </div>
  <div class="scene sB">
    <div class="wesay-lead" id="b-lead"></div>
    <div class="wesay" id="b-say"></div>
  </div>
  <div class="scene sC">
    <div class="mean" id="c-mean"></div>
    <div class="tail" id="c-tail"></div>
  </div>
  <div class="scene sD">
    <div class="dbig" id="d-big"></div>
    <div class="pill" id="d-pill"></div>
    <div class="beta" id="d-beta"></div>
    <div class="beta2" id="d-beta2"></div>
  </div>
  <div class="prog"></div>
  <div class="rframe"></div>
</div>
<script>
const DEFAULT={
  eyebrow:"Typisch Deutsch 🇩🇪",
  leadWords:"In Germany, we don't say",
  notSay:"&ldquo;well done&rdquo;",
  weSayLead:"We say:",
  weSay:'&bdquo;<span class="hl">da kann man<br>nicht meckern</span>&ldquo;',
  meanBig:'= you literally <span class="g">&ldquo;can&rsquo;t complain&rdquo;</span>',
  tail:"…and honestly? I think that's beautiful. 😌",
  dBig:"Learn German verbs<br>faster 🎯",
  dPill:"conjuexpert.app",
  dBeta:'Code <span class="code">FEEDBACK100</span>',
  dBeta2:"30 days Premium · first 100 only",
};
const R=Object.assign({},DEFAULT,(window.__REEL||{}));
const set=(id,h)=>{const el=document.getElementById(id);if(el)el.innerHTML=h;};
document.getElementById('a-eye').textContent=R.eyebrow;
set('a-lead', R.leadWords.split(' ').map(w=>`<span class="kw">${w}</span>`).join(' '));
set('a-notsay', R.notSay + '<span class="strike"></span>');
set('b-lead', R.weSayLead); set('b-say', R.weSay);
set('c-mean', R.meanBig); set('c-tail', R.tail);
set('d-big', R.dBig); set('d-pill', R.dPill); set('d-beta', R.dBeta); set('d-beta2', R.dBeta2);
window.__ready=document.fonts.ready;
</script>
</body></html>
