<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:'SB';src:url('../assets/schib.woff2') format('woff2');font-weight:400 800;font-display:block}
@font-face{font-family:'JB';src:url('../assets/mono.woff2') format('woff2');font-weight:400 700;font-display:block}
:root{--ink:#211d15;--muted:#8b8068;--surface:#fffdf6;--surface-2:#ece3d0;--bg:#f4eede;
  --border:rgba(60,48,24,.14);--red:#ff3b5c;
  --rainbow:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);
  --shadow:0 30px 60px -30px rgba(70,55,25,.42);--shadow-sm:0 8px 22px -12px rgba(70,55,25,.3)}
*{margin:0;padding:0;box-sizing:border-box}
/* ===== SHARED TYPISCH-CARD SPEC (identical in hook + payoff) ===== */
#reel{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'SB',sans-serif}
.glow{position:absolute;top:-220px;left:50%;transform:translateX(-50%);width:1200px;height:620px;background:var(--rainbow);filter:blur(150px);opacity:.10;border-radius:50%;z-index:0}
.wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:172px 96px 0}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-family:'JB';font-weight:700;font-size:30px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--border);padding:16px 30px;border-radius:999px;box-shadow:var(--shadow-sm)}
.eyebrow .dot{width:16px;height:16px;border-radius:50%;background:var(--rainbow)}
.lead{margin-top:78px;font-family:'SB';font-weight:700;font-size:70px;color:var(--ink);text-align:center;letter-spacing:-.02em;line-height:1.1;height:96px}
.lead b{color:var(--ink);font-weight:800}
.card{position:relative;margin-top:46px;width:100%;height:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:40px;box-shadow:var(--shadow);padding:0 66px;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:12px;background:var(--rainbow)}
.big{position:relative;display:inline-block;font-family:'SB';font-weight:800;font-size:120px;line-height:1.06;letter-spacing:-.03em;color:var(--ink);text-align:center}
.sub{margin-top:54px;font-family:'SB';font-weight:600;font-size:46px;color:var(--muted);text-align:center;letter-spacing:-.01em}
.sub .g{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sub .q{color:var(--ink);font-weight:700}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:52px 96px 60px;display:flex;align-items:center;justify-content:space-between}
.foot::before{content:"";position:absolute;top:0;left:96px;right:96px;height:4px;background:var(--rainbow);border-radius:999px;opacity:.9}
.logo{display:flex;align-items:center;gap:16px}
.logo svg{width:58px;height:46px}
.logo .w{font-family:'SB';font-weight:700;font-size:44px;color:var(--ink)}
.logo .w b{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.url{font-family:'JB';font-weight:700;font-size:34px;color:var(--muted)}
/* payoff-specific: highlighter */
.big .hl{background:linear-gradient(180deg,transparent 60%,#ffd23f 60% 92%,transparent 92%);padding:0 8px;border-radius:2px}
</style></head>
<body>
<div id="reel">
  <div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span>Typisch Deutsch 🇩🇪</div>
    <div class="lead">We Germans just <b>say</b></div>
    <div class="card">
      <span class="big">&bdquo;da kann<br><span class="hl">man nicht<br>meckern</span>&ldquo;</span>
      <div class="sub">= you literally <span class="q">&ldquo;can't complain&rdquo;</span></div>
    </div>
  </div>
  <div class="foot">
    <div class="logo">
      <svg viewBox="1 4 30 24" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="16" width="3" height="11" rx="1.5" fill="#ff3b5c"/><rect x="6.5" y="12" width="3" height="15" rx="1.5" fill="#ff7a18"/><rect x="10.5" y="8" width="3" height="19" rx="1.5" fill="#ffc400"/><rect x="14.5" y="5" width="3" height="22" rx="1.5" fill="#34c759"/><rect x="18.5" y="8" width="3" height="19" rx="1.5" fill="#00bcd4"/><rect x="22.5" y="12" width="3" height="15" rx="1.5" fill="#0a84ff"/><rect x="26.5" y="16" width="3" height="11" rx="1.5" fill="#a557ff"/></svg>
      <span class="w">Conju<b>Expert</b></span>
    </div>
    <div class="url">conjuexpert.app</div>
  </div>
</div>
<script>window.__ready=Promise.resolve();</script>
</body></html>
