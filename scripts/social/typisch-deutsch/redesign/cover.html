<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:'SB';src:url('../assets/schib.woff2') format('woff2');font-weight:400 800;font-display:block}
@font-face{font-family:'JB';src:url('../assets/mono.woff2') format('woff2');font-weight:400 700;font-display:block}
:root{--ink:#211d15;--muted:#8b8068;--surface:#fffdf6;--surface-2:#ece3d0;--bg:#f4eede;
  --border:rgba(60,48,24,.14);--red:#ff3b5c;
  --rainbow:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);
  --shadow:0 30px 60px -30px rgba(70,55,25,.42);--shadow-sm:0 8px 22px -12px rgba(70,55,25,.3)}
*{margin:0;padding:0;box-sizing:border-box}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'SB',sans-serif}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1300px;height:900px;background:var(--rainbow);filter:blur(160px);opacity:.12;border-radius:50%;z-index:0}
/* grid-safe square guides (center 1080x1080) — everything vital lives here */
.wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 96px;gap:0}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-family:'JB';font-weight:700;font-size:32px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--border);padding:18px 34px;border-radius:999px;box-shadow:var(--shadow-sm)}
.eyebrow .dot{width:17px;height:17px;border-radius:50%;background:var(--rainbow)}
.lead{margin-top:44px;font-family:'SB';font-weight:700;font-size:74px;color:var(--ink);text-align:center;letter-spacing:-.02em;line-height:1.1}
.lead .r{color:var(--red);font-weight:800}
.card{position:relative;margin-top:44px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:44px;box-shadow:var(--shadow);padding:120px 60px 110px;text-align:center;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:14px;background:var(--rainbow)}
.big{position:relative;display:inline-block;font-family:'SB';font-weight:800;font-size:150px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.big .strike{position:absolute;left:-8px;right:-8px;top:52%;height:16px;border-radius:8px;background:var(--red)}
.hint{margin-top:52px;font-family:'SB';font-weight:700;font-size:50px;color:var(--muted)}
.hint .g{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.logo{position:absolute;left:0;right:0;bottom:150px;z-index:2;display:flex;align-items:center;justify-content:center;gap:16px}
.logo svg{width:52px;height:42px}
.logo .w{font-family:'SB';font-weight:700;font-size:42px;color:var(--ink)}
.logo .w b{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body>
<div id="reel">
  <div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span>Typisch Deutsch 🇩🇪</div>
    <div class="lead">In Germany, <span class="r">nobody</span> says</div>
    <div class="card">
      <span class="big">&ldquo;well&nbsp;done&rdquo;<span class="strike"></span></span>
      <div class="hint">…here's what we <span class="g">really</span> say 👇</div>
    </div>
  </div>
  <div class="logo">
    <svg viewBox="1 4 30 24" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="16" width="3" height="11" rx="1.5" fill="#ff3b5c"/><rect x="6.5" y="12" width="3" height="15" rx="1.5" fill="#ff7a18"/><rect x="10.5" y="8" width="3" height="19" rx="1.5" fill="#ffc400"/><rect x="14.5" y="5" width="3" height="22" rx="1.5" fill="#34c759"/><rect x="18.5" y="8" width="3" height="19" rx="1.5" fill="#00bcd4"/><rect x="22.5" y="12" width="3" height="15" rx="1.5" fill="#0a84ff"/><rect x="26.5" y="16" width="3" height="11" rx="1.5" fill="#a557ff"/></svg>
    <span class="w">Conju<b>Expert</b></span>
  </div>
</div>
<script>window.__ready=Promise.resolve();</script>
</body></html>
