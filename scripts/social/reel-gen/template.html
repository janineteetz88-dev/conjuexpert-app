<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:'SG';src:url('assets/space.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'SB';src:url('assets/schib.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'JB';src:url('assets/mono.woff2') format('woff2');font-weight:400 700;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#14151a;--cream:#f3f4f8;--red:#ff3b5c;--rainbow:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff)}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden;background:
  radial-gradient(120% 80% at 50% 8%, #ffffff 0%, #f3f4f8 55%, #ecedf3 100%);font-family:'SB',sans-serif}
.topbar{position:absolute;top:0;left:0;right:0;height:12px;background:var(--rainbow);z-index:9}
/* glowing animated rainbow border — the eye-catcher */
.rframe{position:absolute;inset:0;z-index:20;pointer-events:none;padding:20px;
  background:linear-gradient(120deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#00bcd4,#0a84ff,#a557ff,#ff3b5c,#ff7a18);
  background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:flow 5s linear infinite, glowpulse 2.2s ease-in-out infinite alternate}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes glowpulse{
  from{filter:drop-shadow(0 0 10px rgba(255,122,24,.55)) drop-shadow(0 0 22px rgba(10,132,255,.4))}
  to{filter:drop-shadow(0 0 22px rgba(255,59,92,.7)) drop-shadow(0 0 46px rgba(165,87,255,.55))}}
/* soft rainbow aura behind hero content */
.aura{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:900px;height:900px;z-index:0;
  border-radius:50%;background:conic-gradient(from 0deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#00bcd4,#0a84ff,#a557ff,#ff3b5c);
  filter:blur(150px);opacity:.16;animation:spin 14s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.logo{position:absolute;top:52px;left:56px;display:flex;align-items:center;gap:14px;z-index:8}
.logo .mark{width:50px;height:40px}
.logo .w{font-family:'SG';font-weight:600;font-size:34px;letter-spacing:-.02em;color:var(--ink)}
.logo .w b{font-weight:700;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 110px;opacity:0;z-index:2}
/* progress */
.prog{position:absolute;left:30px;bottom:30px;height:8px;border-radius:999px;background:var(--rainbow);width:0;z-index:9;opacity:.9}
body.go .prog{animation:prog 11s linear forwards}
@keyframes prog{from{width:0}to{width:1020px}}

/* SCENE A — hook */
.eyebrow{font-family:'JB';font-weight:700;font-size:26px;letter-spacing:.28em;text-transform:uppercase;color:var(--red);margin-bottom:30px}
.hook{font-family:'SG';font-weight:700;font-size:104px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
.hook .split{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.hook .gap{display:inline-block;width:44px}
.hook .emoji{-webkit-text-fill-color:initial;background:none;-webkit-background-clip:border-box;background-clip:border-box}
body.go .sA{animation:sA 11s ease both}
@keyframes sA{0%{opacity:0;transform:translateY(40px) scale(.96)}3%{opacity:1;transform:none}15%{opacity:1;transform:none}19%{opacity:0;transform:translateY(-30px)}100%{opacity:0}}

/* SCENE B — app card */
.blabel{font-family:'SG';font-weight:700;font-size:46px;color:var(--ink);margin-bottom:8px}
.blabel .t{color:var(--red)}
.bsub{font-family:'SB';font-weight:400;font-size:30px;color:#6a7080;margin-bottom:34px}
.card{width:760px;border-radius:36px;overflow:hidden;box-shadow:0 34px 80px -22px rgba(20,22,30,.45),0 0 0 8px #fff,0 0 0 10px rgba(20,22,30,.06)}
.card img{width:100%;display:block}
.callout{margin-top:36px;font-family:'JB';font-weight:700;font-size:30px;color:var(--ink);background:#fff;border:2px solid var(--red);border-radius:999px;padding:16px 30px;box-shadow:0 12px 30px -12px rgba(255,59,92,.5)}
.callout b{color:var(--red)}
body.go .sB{animation:sB 11s ease both}
@keyframes sB{0%{opacity:0}18%{opacity:0}21%{opacity:1;transform:none}22%{opacity:1}54%{opacity:1}58%{opacity:0;transform:translateY(-24px)}100%{opacity:0}}
body.go .sB .card{animation:cardUp 11s ease both}
@keyframes cardUp{0%{transform:translateY(60px)}21%{transform:translateY(60px)}26%{transform:translateY(0)}100%{transform:translateY(0)}}
body.go .sB .callout{animation:pulse 1.1s ease-in-out 6 alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

/* SCENE C — explainer */
.cbig{font-family:'SG';font-weight:700;font-size:72px;line-height:1.08;letter-spacing:-.02em;color:var(--ink);margin-bottom:26px}
.cbig .red{color:var(--red)}
.clead{font-family:'SB';font-weight:400;font-size:34px;color:#6a7080;margin-bottom:40px}
.ex{font-family:'JB';font-weight:700;font-size:52px;color:var(--ink);background:#fff;border-radius:28px;padding:38px 44px;box-shadow:0 24px 60px -24px rgba(20,22,30,.4)}
.ex .a{color:var(--red)}
.extrans{font-family:'SB';font-weight:400;font-size:28px;color:#8890a0;margin-top:22px}
body.go .sC{animation:sC 11s ease both}
@keyframes sC{0%{opacity:0}58%{opacity:0}61%{opacity:1;transform:none}62%{opacity:1}77%{opacity:1}80%{opacity:0;transform:translateY(-24px)}100%{opacity:0}}

/* SCENE D — CTA */
.dbig{font-family:'SG';font-weight:700;font-size:76px;line-height:1.05;letter-spacing:-.02em;color:var(--ink);margin-bottom:40px}
.pill{font-family:'SG';font-weight:700;font-size:46px;color:#fff;background:var(--ink);border-radius:999px;padding:26px 54px;box-shadow:0 20px 44px -16px rgba(20,22,30,.5)}
.beta{margin-top:40px;font-family:'JB';font-weight:700;font-size:32px;color:var(--ink)}
.beta .code{background:var(--red);color:#fff;padding:6px 16px;border-radius:10px}
.beta2{font-family:'JB';font-weight:700;font-size:24px;letter-spacing:.06em;color:#8890a0;margin-top:16px;text-transform:uppercase}
body.go .sD{animation:sD 11s ease both}
@keyframes sD{0%{opacity:0}80%{opacity:0}83%{opacity:1;transform:none}100%{opacity:1}}
body.go .sD .pill{animation:pop 11s ease both}
@keyframes pop{0%{transform:scale(.9)}83%{transform:scale(.9)}88%{transform:scale(1)}100%{transform:scale(1)}}
</style></head>
<body>
<div id="reel">
  <div class="aura"></div>
  <div class="logo">
    <svg class="mark" viewBox="1 4 30 24" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="16" width="3" height="11" rx="1.5" fill="#ff3b5c"/><rect x="6.5" y="12" width="3" height="15" rx="1.5" fill="#ff7a18"/><rect x="10.5" y="8" width="3" height="19" rx="1.5" fill="#ffc400"/><rect x="14.5" y="5" width="3" height="22" rx="1.5" fill="#34c759"/><rect x="18.5" y="8" width="3" height="19" rx="1.5" fill="#00bcd4"/><rect x="22.5" y="12" width="3" height="15" rx="1.5" fill="#0a84ff"/><rect x="26.5" y="16" width="3" height="11" rx="1.5" fill="#a557ff"/></svg>
    <span class="w">Conju<b>Expert</b></span>
  </div>

  <div class="scene sA">
    <div class="eyebrow" id="a-eye">Verb des Tages</div>
    <div class="hook" id="a-hook"></div>
  </div>

  <div class="scene sB">
    <div class="blabel" id="b-label"></div>
    <div class="bsub" id="b-sub"></div>
    <div class="card"><img id="b-img" src="" alt=""></div>
    <div class="callout" id="b-callout"></div>
  </div>

  <div class="scene sC">
    <div class="cbig" id="c-big"></div>
    <div class="clead" id="c-lead"></div>
    <div class="ex" id="c-ex"></div>
    <div class="extrans" id="c-trans"></div>
  </div>

  <div class="scene sD">
    <div class="dbig" id="d-big"></div>
    <div class="pill" id="d-pill"></div>
    <div class="beta" id="d-beta"></div>
    <div class="beta2" id="d-beta2"></div>
  </div>

  <div class="prog"></div>
  <div class="rframe"></div>
</div>

<script>
// ---- Reel config (the "generator" seam: change this -> new reel) ----
const DEFAULT = {
  eyebrow: "Verb des Tages",
  hookTop: "German verbs that",
  hookSplit: "split&nbsp;in&nbsp;half",
  hookEmoji: "🤯",
  bLabel: 'Meet: <span class="t">aufstehen</span>',
  bSub: "(to get up) — a separable verb",
  bImg: "assets/aufstehen-forms.png",
  bCallout: 'the &ldquo;<b>auf</b>&rdquo; flies to the end →',
  cBig: 'It&rsquo;s a <span class="red">separable</span> verb.',
  cLead: "The prefix jumps to the end of the sentence:",
  cEx: 'Ich <span class="a">stehe</span> um 7 Uhr <span class="a">auf</span>.',
  cTrans: "= I get up at 7.",
  dBig: "Master every German verb — free.",
  dPill: "conjuexpert.app",
  dBeta: 'Code <span class="code">FEEDBACK100</span>',
  dBeta2: "30 days Premium · first 100 only",
};
const R = Object.assign({}, DEFAULT, (window.__REEL || {}));
const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
set('a-eye', R.eyebrow);
set('a-hook', R.hookTop + '<br><span class="split">' + R.hookSplit + '</span>' + (R.hookEmoji ? ' <span class="emoji">' + R.hookEmoji + '</span>' : ''));
set('b-label', R.bLabel); set('b-sub', R.bSub); set('b-callout', R.bCallout);
document.getElementById('b-img').src = R.bImg;
set('c-big', R.cBig); set('c-lead', R.cLead); set('c-ex', R.cEx); set('c-trans', R.cTrans);
set('d-big', R.dBig); set('d-pill', R.dPill); set('d-beta', R.dBeta); set('d-beta2', R.dBeta2);
window.__ready = (async () => {
  await document.fonts.ready;
  const img = document.getElementById('b-img');
  if (!img.complete) await new Promise(r => { img.onload = r; img.onerror = r; });
})();
</script>
</body></html>
