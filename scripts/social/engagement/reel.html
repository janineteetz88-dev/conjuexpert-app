<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:'SB';src:url('../typisch-deutsch/assets/schib.woff2') format('woff2');font-weight:400 800;font-display:block}
@font-face{font-family:'JB';src:url('../typisch-deutsch/assets/mono.woff2') format('woff2');font-weight:400 700;font-display:block}
:root{--ink:#211d15;--muted:#8b8068;--surface:#fffdf6;--surface-2:#ece3d0;--bg:#f4eede;
  --border:rgba(60,48,24,.14);--blue:#0a84ff;--green:#34c759;
  --rainbow:linear-gradient(90deg,#ff3b5c,#ff7a18,#ffc400,#34c759,#0a84ff,#a557ff);
  --shadow:0 30px 60px -30px rgba(70,55,25,.42);--shadow-sm:0 8px 22px -12px rgba(70,55,25,.3);--dur:16s}
*{margin:0;padding:0;box-sizing:border-box}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'SB',sans-serif}
.glow{position:absolute;top:-220px;left:50%;transform:translateX(-50%);width:1200px;height:620px;background:var(--rainbow);filter:blur(150px);opacity:.10;border-radius:50%;z-index:0}
body.go .glow{animation:drift var(--dur) ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-50%) translateY(40px) scale(1.08)}}
.wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:140px 90px 210px}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-family:'JB';font-weight:700;font-size:29px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--border);padding:15px 28px;border-radius:999px;box-shadow:var(--shadow-sm);opacity:0}
.eyebrow .grad{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
body.go .eyebrow{animation:pop .5s cubic-bezier(.2,.9,.25,1) .05s both}
@keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.eyebrow .lvl{color:var(--green);border-left:1.5px solid var(--border);padding-left:14px}
.lead{margin-top:40px;font-family:'SB';font-weight:800;font-size:64px;color:var(--ink);letter-spacing:-.02em;opacity:0}
body.go .lead{animation:fly .6s cubic-bezier(.2,.9,.25,1) .5s both}
@keyframes fly{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.target{margin-top:30px;display:inline-flex;align-items:center;gap:18px;opacity:0}
.target .pill{font-family:'JB';font-weight:700;font-size:33px;letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#ff3b5c,#a557ff);padding:14px 32px;border-radius:999px}
.target .ask{font-family:'JB';font-weight:700;font-size:30px;color:var(--muted)}
body.go .target{animation:fly .7s cubic-bezier(.2,.9,.25,1) 1.8s both}
.card{position:relative;overflow:hidden;margin-top:34px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:34px;box-shadow:var(--shadow);padding:66px 54px 60px;text-align:center;opacity:0}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:var(--rainbow)}
body.go .card{animation:cin .7s cubic-bezier(.2,.9,.25,1) 3.0s both}
@keyframes cin{from{opacity:0;transform:translateY(46px) scale(.98)}to{opacity:1;transform:none}}
.sentence{font-family:'JB';font-weight:700;font-size:52px;line-height:1.34;color:var(--ink)}
.sentence .blank{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em}
.hint{margin-top:20px;font-family:'SB';font-weight:600;font-size:30px;color:var(--muted)}
.opts{margin-top:40px;display:flex;gap:26px;width:100%;justify-content:center}
.opt{flex:1;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:34px 20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0}
.opt .lbl{width:66px;height:66px;border-radius:50%;font-family:'SB';font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center}
.opt.a .lbl{background:color-mix(in srgb,var(--red,#ff3b5c) 16%,var(--surface));color:var(--red,#ff3b5c)}
.opt.b .lbl{background:color-mix(in srgb,var(--green) 18%,var(--surface));color:var(--green)}
.opt .val{font-family:'JB';font-weight:700;font-size:50px;color:var(--ink)}
body.go .opt.a{animation:opin .6s cubic-bezier(.2,.9,.25,1) 5.4s both}
body.go .opt.b{animation:opin .6s cubic-bezier(.2,.9,.25,1) 5.9s both}
@keyframes opin{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}
/* countdown ring */
.timer{margin-top:26px;position:relative;width:180px;height:180px;opacity:0}
body.go .timer{animation:timerlife var(--dur) ease both}
@keyframes timerlife{0%{opacity:0}40%{opacity:0}43%{opacity:1}76%{opacity:1}80%{opacity:0}100%{opacity:0}}
.timer svg{transform:rotate(-90deg)}
.timer .track{fill:none;stroke:var(--surface-2);stroke-width:16}
.timer .prog{fill:none;stroke:url(#rg);stroke-width:16;stroke-linecap:round;stroke-dasharray:471;stroke-dashoffset:0}
body.go .timer .prog{animation:tick var(--dur) linear both}
@keyframes tick{0%{stroke-dashoffset:0}42%{stroke-dashoffset:0}74%{stroke-dashoffset:471}100%{stroke-dashoffset:471}}
.timer .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:74px}
/* CTA banner */
.cta{margin-top:auto;margin-bottom:40px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0}
body.go .cta{animation:fly .7s cubic-bezier(.2,.9,.25,1) 8.6s both}
.cta .banner{font-family:'SB';font-weight:800;font-size:52px;color:#fff;background:var(--ink);border-radius:999px;padding:28px 50px;box-shadow:var(--shadow);text-align:center;line-height:1.14}
body.go .cta .banner{animation:pulse 1.6s ease-in-out 9.3s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.cta .reveal{font-family:'JB';font-weight:700;font-size:30px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 90px 54px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px}.logo svg{width:52px;height:42px}
.logo .w{font-family:'SB';font-weight:700;font-size:40px;color:var(--ink)}
.logo .w b{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.url{font-family:'JB';font-weight:700;font-size:32px;color:var(--muted)}
.prog2{position:absolute;left:90px;right:90px;bottom:130px;height:4px;background:var(--rainbow);border-radius:999px;transform:scaleX(0);transform-origin:left;z-index:4}
body.go .prog2{animation:pg var(--dur) linear both}
@keyframes pg{to{transform:scaleX(1)}}
</style></head>
<body>
<div id="reel">
  <div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow">💬 <span class="grad">Comment Quiz</span><span class="lvl" id="cq-lvl">B1–B2</span></div>
    <div class="lead" id="cq-q">Which one fits? 🤔</div>
    <div class="target"><span class="pill" id="cq-target">PERFEKT</span><span class="ask" id="cq-ask"></span></div>
    <div class="card"><div class="sentence" id="cq-sentence"></div></div>
    <div class="opts">
      <div class="opt a"><span class="lbl">A</span><span class="val" id="cq-a"></span></div>
      <div class="opt b"><span class="lbl">B</span><span class="val" id="cq-b"></span></div>
    </div>
    <div class="timer"><svg width="180" height="180" viewBox="0 0 180 180"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b5c"/><stop offset=".25" stop-color="#ffc400"/><stop offset=".5" stop-color="#34c759"/><stop offset=".75" stop-color="#0a84ff"/><stop offset="1" stop-color="#a557ff"/></linearGradient></defs><circle class="track" cx="90" cy="90" r="75"/><circle class="prog" cx="90" cy="90" r="75"/></svg><div class="face">🤔</div></div>
    <div class="cta"><div class="banner">👇 A or B?<br>Comment your answer!</div></div>
  </div>
  <div class="prog2"></div>
  <div class="foot">
    <div class="logo"><svg viewBox="1 4 30 24" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="16" width="3" height="11" rx="1.5" fill="#ff3b5c"/><rect x="6.5" y="12" width="3" height="15" rx="1.5" fill="#ff7a18"/><rect x="10.5" y="8" width="3" height="19" rx="1.5" fill="#ffc400"/><rect x="14.5" y="5" width="3" height="22" rx="1.5" fill="#34c759"/><rect x="18.5" y="8" width="3" height="19" rx="1.5" fill="#00bcd4"/><rect x="22.5" y="12" width="3" height="15" rx="1.5" fill="#0a84ff"/><rect x="26.5" y="16" width="3" height="11" rx="1.5" fill="#a557ff"/></svg><span class="w">Conju<b>Expert</b></span></div>
    <div class="url">conjuexpert.app</div>
  </div>
</div>
<script>
const DEFAULT={level:"B1–B2",q:"Which one fits? 🤔",target:"PERFEKT",ask:"sein or haben?",sentence:'Ich <span class="blank">___</span> gestern<br>nach Hause gelaufen.',a:"bin",b:"habe"};
const C=Object.assign({},DEFAULT,(window.__CQ||{}));
const set=(id,h)=>{const el=document.getElementById(id);if(el)el.innerHTML=h;};
set('cq-lvl',C.level);set('cq-q',C.q);set('cq-target',C.target);set('cq-ask',C.ask);set('cq-sentence',C.sentence);set('cq-a',C.a);set('cq-b',C.b);
window.__ready=document.fonts?document.fonts.ready:Promise.resolve();
</script>
</body></html>
