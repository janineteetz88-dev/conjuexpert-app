<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConjuExpert · Reorder-Popup (Vorschau)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Effektive ConjuExpert-CI-Tokens (Stand: aktuelle App) ===== */
  :root{
    --bg:#f4eede;
    --surface:#fffdf6;
    --surface-2:#ece3d0;
    --text:#211d15;
    --muted:#8b8068;
    --border:rgba(60,48,24,.12);
    --shadow:0 22px 48px -26px rgba(70,55,25,.4);
    --font-display:"Schibsted Grotesk", system-ui, sans-serif;
    --brand-rainbow:linear-gradient(90deg,#ff5a4d,#ff9e2c,#ffcf3f,#5bbf6a,#3aa6c9,#5b8def,#a874e6);
    --selbg:#211d15;
    --selfg:#fdf8ec;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; font-family:var(--font-display);
        /* gedimmter App-Hintergrund, damit das Popup wie in der App wirkt */
        background:
          radial-gradient(120% 90% at 50% -10%, color-mix(in srgb, var(--surface) 70%, var(--bg)), var(--bg)) ; }
  .stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;
          background:rgba(33,29,21,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }

  /* ===== Popup (1:1 aus der App) ===== */
  .cj-pop{ position:relative; width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border);
           border-radius:24px; box-shadow:var(--shadow); padding:26px 22px 20px; display:flex; flex-direction:column;
           align-items:center; text-align:center; overflow:hidden; animation:skup .34s cubic-bezier(.22,1,.36,1) both; }
  .cj-pop::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--brand-rainbow); }
  @keyframes skup{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:none; } }
  .cj-x{ position:absolute; top:12px; right:12px; width:34px; height:34px; border:1px solid var(--border);
         background:var(--surface-2); color:var(--muted); border-radius:50%; display:flex; align-items:center;
         justify-content:center; cursor:pointer; padding:0; }
  .cj-x svg{ width:14px; height:14px; }

  /* ===== Reorder-Demo: echte Sprach-Kacheln (1:1 wie App-Leiste, Calm-CI) ===== */
  .cj-media{ width:100%; display:flex; justify-content:center; margin:2px 0 16px; }
  .langbar{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:8px 12px 9px; background:var(--surface);
            width:100%; max-width:300px; border:1px solid var(--border); border-radius:16px; }
  .langbtn{ position:relative; border:1px solid var(--border); border-radius:12px;
            background:linear-gradient(180deg,#fffefa,var(--surface-2)); box-shadow:0 1px 0 rgba(0,0,0,.02);
            color:var(--muted); padding:6px 2px; display:flex; flex-direction:column; align-items:center; gap:2px;
            font-family:var(--font-display); overflow:hidden; }
  .langstripe{ display:none; }            /* in der Calm-CI ausgeblendet */
  .langflag{ font-size:13px; line-height:1; font-weight:700; }
  .langname{ font-size:8px; font-weight:500; white-space:nowrap; }
  .langbtn.active{ background:#2c2823; border-color:#2c2823; box-shadow:0 8px 16px -10px rgba(40,32,15,.5); }
  .langbtn.active .langflag, .langbtn.active .langname{ color:var(--selfg); }
  .langbar.reordering .langbtn:not(.dragging){ animation:langjiggle .34s ease-in-out infinite; }
  @keyframes langjiggle{ 0%,100%{ transform:rotate(-1.2deg); } 50%{ transform:rotate(1.2deg); } }
  .langbtn.dragging{ z-index:5; box-shadow:var(--shadow); }
  .rmover{ animation:rmove 2.6s cubic-bezier(.45,.05,.35,1) infinite alternate; }
  @keyframes rmove{
    0%{ transform:translate(0,0) scale(1.02); }
    22%{ transform:translate(0,-16px) scale(1.12); }
    100%{ transform:translate(122px,-16px) scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce){
    .rmover{ animation:none; transform:translateY(-8px) scale(1.08); }
    .langbar.reordering .langbtn{ animation:none !important; }
  }

  .cj-head{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.02em; line-height:1.15; margin-bottom:8px; color:var(--text); }
  .cj-text{ font-size:14px; line-height:1.55; color:var(--muted); margin:0 0 4px; }
  .cj-btns{ width:100%; margin-top:16px; display:flex; flex-direction:column; gap:9px; }
  .cj-btn{ width:100%; min-height:48px; padding:14px 16px; border-radius:14px; font-family:var(--font-display);
           font-weight:700; font-size:14.5px; cursor:pointer; border:1.5px solid transparent; display:flex;
           align-items:center; justify-content:center; gap:8px; }
  .cj-btn.ink{ color:var(--selfg);
               background:linear-gradient(var(--selbg),var(--selbg)) padding-box, var(--brand-rainbow) border-box;
               box-shadow:0 10px 22px -10px rgba(30,22,8,.6); }
  .note{ position:fixed; left:0; right:0; bottom:10px; text-align:center; color:#fff; opacity:.85; font-size:12px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="cj-pop" role="dialog" aria-label="Kacheln frei anordnen">
      <button class="cj-x" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="cj-media">
        <div class="rdemo langbar reordering" aria-hidden="true">
          <button class="langbtn active"><span class="langstripe"></span><span class="langflag">DE</span><span class="langname">Deutsch</span></button>
          <button class="langbtn dragging rmover"><span class="langstripe"></span><span class="langflag">ES</span><span class="langname">Español</span></button>
          <button class="langbtn"><span class="langstripe"></span><span class="langflag">EN</span><span class="langname">English</span></button>
          <button class="langbtn"><span class="langstripe"></span><span class="langflag">NL</span><span class="langname">Nederlands</span></button>
          <button class="langbtn"><span class="langstripe"></span><span class="langflag">FR</span><span class="langname">Français</span></button>
        </div>
      </div>
      <div class="cj-head">Ordne die Kacheln frei an</div>
      <p class="cj-text">Halte oben eine Sprach-Kachel oder unten ein Menü-Symbol gedrückt und zieh es an die gewünschte Stelle. Deine Reihenfolge bleibt gespeichert.</p>
      <div class="cj-btns">
        <button class="cj-btn ink">Verstanden</button>
      </div>
    </div>
  </div>
  <div class="note">Vorschau · die Animation läuft in Schleife (eine Kachel wird angehoben &amp; gezogen)</div>
</body>
</html>
